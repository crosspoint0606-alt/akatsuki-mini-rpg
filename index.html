<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11261f" />
    <title>アカツキとエウレカの冒険記</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="title-area">
        <p class="eyebrow">MINI BROWSER RPG</p>
        <h1>アカツキとエウレカの冒険記</h1>
      </header>

      <section class="scene" aria-label="戦闘画面">
        <div class="sky-orb" aria-hidden="true"></div>
        <div class="hero-area">
          <div class="hero-sprite" aria-hidden="true">⚔️</div>
          <span>アカツキ</span>
        </div>
        <div class="enemy-area" id="enemyArea">
          <div class="slime" aria-hidden="true"><i></i><b></b><span>⌣</span></div>
          <strong>スライム</strong>
          <small id="enemyHp">HP 60</small>
        </div>
        <p class="battle-message" id="battleMessage" aria-live="polite">スライムが あらわれた！</p>
      </section>

      <section class="status-card" aria-label="アカツキのステータス">
        <div class="character-heading">
          <div>
            <p class="name">アカツキ <span>Lv.1</span></p>
            <p class="weapon">⚔ 木刀</p>
          </div>
          <p class="gold">💰 100G</p>
        </div>
        <div class="stat-row">
          <span>HP</span><div class="meter"><div class="meter-fill hp-fill" id="hpFill"></div></div><b id="hpValue">100 / 100</b>
        </div>
        <div class="stat-row">
          <span>MP</span><div class="meter"><div class="meter-fill mp-fill"></div></div><b>30 / 30</b>
        </div>
        <div class="exp-row"><span>EXP</span><b id="expValue">0</b></div>
      </section>

      <section class="actions" aria-label="戦闘コマンド">
        <button class="action-button attack" id="attackButton" type="button"><span>⚔</span>攻撃</button>
        <button class="action-button heal" id="healButton" type="button"><span>✦</span>回復</button>
        <button class="action-button run" id="runButton" type="button"><span>↗</span>逃げる</button>
      </section>
      <button class="restart-button hidden" id="restartButton" type="button">もう一度冒険する</button>
    </main>
    <script src="script.js"></script>
  </body>
</html>
